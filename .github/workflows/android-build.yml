name: FranProbe Android build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Generate and verify Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          chmod +x gradlew
          echo "b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          if ! grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            echo 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Unit tests, lint and APK
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Copy APK with readable name
        run: cp app/build/outputs/apk/debug/app-debug.apk FranProbe-2.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FranProbe-debug-APK
          path: FranProbe-2.0.0-debug.apk
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FranProbe-build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
